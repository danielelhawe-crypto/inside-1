<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="robots" content="noindex,nofollow"/>
<title>🧸 اصنع عروستك!</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0a2e;font-family:'Tajawal',sans-serif}
canvas{position:fixed;top:0;left:0;display:block}

/* Logo */
#logo{position:fixed;top:10px;left:14px;z-index:200;font-size:.65rem;font-weight:900;
  letter-spacing:.3em;color:#FF6B9D;opacity:.45;pointer-events:none;text-transform:uppercase;
  font-family:'Tajawal',sans-serif}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:100;
  background:linear-gradient(180deg,#1a0a2ef0 55%,transparent);
  padding:10px 16px 6px;display:flex;flex-direction:column;align-items:center;gap:5px}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:28px;height:7px;border-radius:4px;background:#ffffff18;transition:all .35s}
.dot.done{background:#4ade80}
.dot.active{background:linear-gradient(90deg,#FF6B9D,#9B5DE5);width:44px}
#stage-lbl{font-size:.78rem;font-weight:700;color:#fff;opacity:.75;letter-spacing:.04em}

/* Instruction bar */
#inst-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:linear-gradient(0deg,#1a0a2ef5 65%,transparent);
  padding:10px 20px 20px;text-align:center}
#inst-txt{color:#fff;font-size:.95rem;font-weight:700;min-height:1.3em;margin-bottom:6px}
#prog-wrap{width:200px;height:9px;background:#ffffff18;border-radius:5px;
  overflow:hidden;margin:0 auto;display:none}
#prog-fill{height:100%;width:0%;background:linear-gradient(90deg,#FF6B9D,#FFD93D);
  border-radius:5px;transition:width .12s linear}

/* Done screen */
#done-scr{position:fixed;inset:0;z-index:500;
  background:linear-gradient(135deg,#1a0a2e,#2d0a3e);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:30px;text-align:center}
#done-scr canvas{border-radius:20px;box-shadow:0 0 50px #FF6B9D44;max-width:240px}
#done-scr h1{color:#FFD93D;font-size:1.9rem;font-weight:900}
#done-scr p{color:#ffcce6;font-size:1rem;max-width:300px}
.done-btn{background:linear-gradient(135deg,#FF6B9D,#9B5DE5);color:#fff;border:none;
  border-radius:50px;padding:12px 34px;font-size:1rem;font-weight:800;
  font-family:'Tajawal',sans-serif;cursor:pointer;margin-top:4px}
.done-btn.outline{background:none;border:2px solid #9B5DE5;color:#9B5DE5}

/* Particle */
.prt{position:fixed;pointer-events:none;z-index:600;font-size:1.3rem;
  animation:pfall 1.2s ease-in forwards}
@keyframes pfall{0%{opacity:1;transform:translateY(-10px) rotate(0deg)}
  100%{opacity:0;transform:translateY(110px) rotate(360deg) scale(.3)}}
</style>
</head>
<body>
<div id="logo">inside</div>
<div id="hud">
  <div class="dots" id="dots"></div>
  <div id="stage-lbl">✂️ قص القماش</div>
</div>
<canvas id="gc"></canvas>
<div id="inst-bar">
  <div id="inst-txt">حرّك إصبعك على الخط لتقص العروسة</div>
  <div id="prog-wrap"><div id="prog-fill"></div></div>
</div>
<div id="done-scr">
  <canvas id="done-c" width="220" height="308"></canvas>
  <h1>🎉 عروستك جاهزة!</h1>
  <p>صنعتِ عروسة رائعة بيديكِ 🧸✨</p>
  <button class="done-btn" onclick="location.href='index.html'">🏠 الرئيسية</button>
  <button class="done-btn outline" onclick="G.restart()">🔄 العب مرة أخرى</button>
</div>

<script>
'use strict';
// ══════════════════════════════════════════════════════════
//  VIRTUAL COORDINATE SYSTEM  VW=400  VH=700
// ══════════════════════════════════════════════════════════
const VW=400, VH=700;
let scale=1, oX=0, oY=0; // offset for letterbox

// Doll anatomy (virtual)
const D={
  hx:200,hy:112,hr:62,
  bx:140,by:176,bw:120,bh:125,
  lax1:140,lay1:196,lacx:75,lacy:248,lax2:60,lay2:300,
  rax1:260,ray1:196,racx:325,racy:248,rax2:340,ray2:300,
  llx:155,lly1:300,lly2:487,
  rlx:245,rly1:300,rly2:487,
  lshx:152,lshy:495, rshx:248,rshy:495,
};
const BRAID_L=[{x:134,y:130},{x:118,y:154},{x:136,y:178},{x:118,y:202},{x:136,y:226},{x:118,y:250},{x:136,y:274},{x:96,y:312}];
const BRAID_R=[{x:266,y:130},{x:282,y:154},{x:264,y:178},{x:282,y:202},{x:264,y:226},{x:282,y:250},{x:264,y:274},{x:304,y:312}];

// ── Cutting path (53 waypoints clockwise) ─────────────────
const CUT_PATH=[
  {x:200,y:50},{x:232,y:55},{x:257,y:71},{x:269,y:96},{x:269,y:126},{x:258,y:150},{x:244,y:163},
  {x:233,y:171},{x:260,y:177},
  {x:296,y:212},{x:325,y:254},{x:334,y:296},{x:322,y:312},{x:303,y:319},
  {x:283,y:305},{x:268,y:265},{x:261,y:226},{x:261,y:198},
  {x:261,y:299},
  {x:249,y:311},{x:251,y:395},{x:253,y:456},{x:257,y:487},
  {x:270,y:501},{x:261,y:514},{x:239,y:520},{x:200,y:522},
  {x:161,y:520},{x:139,y:514},{x:130,y:501},
  {x:143,y:487},{x:147,y:456},{x:149,y:395},{x:151,y:311},
  {x:139,y:299},{x:139,y:198},{x:139,y:226},{x:132,y:265},{x:117,y:305},
  {x:97,y:319},{x:78,y:312},{x:66,y:296},{x:75,y:254},{x:104,y:212},
  {x:140,y:177},{x:156,y:171},{x:156,y:163},{x:142,y:150},{x:131,y:126},{x:131,y:96},{x:143,y:71},{x:168,y:55},
  {x:200,y:50}
];

// ── Sewing sections ────────────────────────────────────────
function buildSewSections(){
  // Body: 15 stitches around rect
  const body=[];
  for(let i=0;i<5;i++) body.push({x:152+i*24,y:178});
  for(let i=0;i<3;i++) body.push({x:259,y:200+i*34});
  for(let i=0;i<4;i++) body.push({x:250-i*28,y:299});
  for(let i=0;i<3;i++) body.push({x:141,y:272-i*34});
  // Left arm: 10 along bezier
  const lArm=[]; for(let i=0;i<10;i++){const t=i/9; lArm.push({x:Math.round((1-t)*(1-t)*D.lax1+2*(1-t)*t*D.lacx+t*t*D.lax2),y:Math.round((1-t)*(1-t)*D.lay1+2*(1-t)*t*D.lacy+t*t*D.lay2)});}
  // Right arm: 10 along bezier
  const rArm=[]; for(let i=0;i<10;i++){const t=i/9; rArm.push({x:Math.round((1-t)*(1-t)*D.rax1+2*(1-t)*t*D.racx+t*t*D.rax2),y:Math.round((1-t)*(1-t)*D.ray1+2*(1-t)*t*D.racy+t*t*D.ray2)});}
  // Legs: 10 each
  const lLeg=[]; for(let i=0;i<10;i++) lLeg.push({x:D.llx-4,y:D.lly1+i*19});
  const rLeg=[]; for(let i=0;i<10;i++) rLeg.push({x:D.rlx+4,y:D.rly1+i*19});
  return[
    {name:'الجسم',pts:body},
    {name:'الإيد اليسار',pts:lArm},
    {name:'الإيد اليمين',pts:rArm},
    {name:'الرجل اليسار',pts:lLeg},
    {name:'الرجل اليمين',pts:rLeg},
  ];
}

// ══════════════════════════════════════════════════════════
//  CANVAS & SCALE
// ══════════════════════════════════════════════════════════
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
let makeupCanvas=document.createElement('canvas');
let mctx=makeupCanvas.getContext('2d');

function s(v){return v*scale;}
function sx(v){return oX+v*scale;}
function sy(v){return oY+v*scale;}
function toV(e){
  const src=e.changedTouches?e.changedTouches[0]:e;
  const r=canvas.getBoundingClientRect();
  return{x:(src.clientX-r.left-oX)/scale, y:(src.clientY-r.top-oY)/scale};
}

function resize(){
  const HUD=58, INST=80;
  const aw=window.innerWidth, ah=window.innerHeight-HUD-INST;
  scale=Math.min(aw/VW, ah/VH);
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  oX=(window.innerWidth-VW*scale)/2;
  oY=HUD+(ah-VH*scale)/2;
  makeupCanvas.width=canvas.width; makeupCanvas.height=canvas.height;
}

// ══════════════════════════════════════════════════════════
//  AUDIO (procedural — no files needed)
// ══════════════════════════════════════════════════════════
let _ac=null;
function ac(){if(!_ac){try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return _ac;}
function playTone(freq,dur,vol=0.25){
  try{const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.value=freq;
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
    o.start();o.stop(a.currentTime+dur);}catch(e){}
}
function sndClick(){playTone(600,.07,.18);}
function sndStitch(){playTone(900,.06,.15);}
function sndSnap(){playTone(440,.12,.22);setTimeout(()=>playTone(660,.1,.18),80);}
function sndSuccess(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.22,.2),i*100));}
function vibrate(ms=30){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}

// ══════════════════════════════════════════════════════════
//  DRAWING LIBRARY
// ══════════════════════════════════════════════════════════
function drawFabric(){
  ctx.fillStyle='#FFE4EF'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const sz=s(20);
  ctx.fillStyle='rgba(255,150,195,0.22)';
  for(let r=0;r*sz<canvas.height+sz;r++)
    for(let c=0;c*sz<canvas.width+sz;c++)
      if((r+c)%2===0) ctx.fillRect(c*sz,r*sz,sz,sz);
}

function drawBraids(placed=false){
  [BRAID_L,BRAID_R].forEach(pts=>{
    ctx.save();ctx.strokeStyle='#7B1515';ctx.lineWidth=s(11);ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(sx(pts[0].x),sy(pts[0].y));
    for(let i=1;i<pts.length;i++) ctx.lineTo(sx(pts[i].x),sy(pts[i].y));
    ctx.stroke();ctx.restore();
  });
  if(placed){
    // Hair ties
    const tips=[BRAID_L[BRAID_L.length-1],BRAID_R[BRAID_R.length-1]];
    const cols=['#FFD93D','#00BBF9'];
    tips.forEach((p,i)=>{
      ctx.save();ctx.fillStyle=cols[i];ctx.strokeStyle='#fff';ctx.lineWidth=s(2);
      ctx.beginPath();ctx.arc(sx(p.x),sy(p.y),s(9),0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff';ctx.font=`bold ${s(9)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✿',sx(p.x),sy(p.y));ctx.restore();
    });
  }
}

function drawLegs(inflateR=0){
  const w=s(22+inflateR*6); ctx.lineCap='round';
  ctx.save();ctx.strokeStyle='#FFD5B8';ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(sx(D.llx),sy(D.lly1));ctx.lineTo(sx(D.llx),sy(D.lly2));ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx(D.rlx),sy(D.rly1));ctx.lineTo(sx(D.rlx),sy(D.rly2));ctx.stroke();
  ctx.restore();
  // shoes
  ctx.save();ctx.fillStyle='#9B5DE5';
  ctx.beginPath();ctx.ellipse(sx(D.lshx),sy(D.lshy),s(22+inflateR*3),s(12),0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(sx(D.rshx),sy(D.rshy),s(22+inflateR*3),s(12),0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawArms(inflateR=0){
  ctx.save();ctx.strokeStyle='#FFD5B8';ctx.lineWidth=s(20+inflateR*5);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(sx(D.lax1),sy(D.lay1));ctx.quadraticCurveTo(sx(D.lacx),sy(D.lacy),sx(D.lax2),sy(D.lay2));ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx(D.rax1),sy(D.ray1));ctx.quadraticCurveTo(sx(D.racx),sy(D.racy),sx(D.rax2),sy(D.ray2));ctx.stroke();
  // hands
  ctx.fillStyle='#FFD5B8';
  ctx.beginPath();ctx.arc(sx(D.lax2),sy(D.lay2),s(13+inflateR*2),0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx(D.rax2),sy(D.ray2),s(13+inflateR*2),0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawBody(inflateR=0){
  const inf=inflateR*s(6);
  ctx.save();ctx.fillStyle='#FF6B9D';
  ctx.beginPath();ctx.roundRect(sx(D.bx)-inf/2,sy(D.by),s(D.bw)+inf,s(D.bh)+inf/2,s(10));ctx.fill();
  // stripes
  ctx.strokeStyle='#9B5DE5';ctx.lineWidth=s(3.5);ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(sx(D.bx),sy(D.by+10));ctx.lineTo(sx(D.bx+D.bw),sy(D.by+10));ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx(D.bx),sy(D.by+D.bh-10));ctx.lineTo(sx(D.bx+D.bw),sy(D.by+D.bh-10));ctx.stroke();
  // heart
  drawHeart(sx(D.bx+D.bw/2),sy(D.by+D.bh/2+5),s(13),'#FFD93D');
  ctx.restore();
}

function drawHead(state={}){
  const{eyesOn=true,hairOn=true,lipstick=false,powder=false,inflateR=0}=state;
  ctx.save();
  ctx.fillStyle='#FFD5B8';
  ctx.beginPath();ctx.arc(sx(D.hx),sy(D.hy),s(D.hr)+inflateR*s(4),0,Math.PI*2);ctx.fill();
  // cheeks
  ctx.fillStyle=powder?'rgba(255,120,140,.55)':'rgba(255,179,198,.4)';
  ctx.beginPath();ctx.ellipse(sx(D.hx-30),sy(D.hy+10),s(16),s(11),0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(sx(D.hx+30),sy(D.hy+10),s(16),s(11),0,0,Math.PI*2);ctx.fill();
  if(eyesOn){
    [[D.hx-22,D.hy-4],[D.hx+22,D.hy-4]].forEach(([ex,ey])=>{
      ctx.fillStyle='white';ctx.beginPath();ctx.ellipse(sx(ex),sy(ey),s(11),s(12),0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#222';ctx.beginPath();ctx.arc(sx(ex),sy(ey),s(7),0,Math.PI*2);ctx.fill();
      ctx.fillStyle='white';ctx.beginPath();ctx.arc(sx(ex+3),sy(ey-4),s(2.5),0,Math.PI*2);ctx.fill();
    });
    // eyelashes
    ctx.strokeStyle='#222';ctx.lineWidth=s(1.6);ctx.lineCap='round';
    [-14,-8,8,14].forEach(ox=>{
      const side=ox<0?-1:1, bx=D.hx+side*22+ox;
      ctx.beginPath();ctx.moveTo(sx(bx),sy(D.hy-4-9));ctx.lineTo(sx(bx+ox*0.3),sy(D.hy-4-13));ctx.stroke();
    });
  }
  // mouth
  ctx.strokeStyle=lipstick?'#B80028':'#E8756B';
  ctx.lineWidth=lipstick?s(4):s(2.8);ctx.lineCap='round';ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(sx(D.hx-16),sy(D.hy+18));
  ctx.quadraticCurveTo(sx(D.hx),sy(D.hy+30),sx(D.hx+16),sy(D.hy+18));ctx.stroke();
  ctx.restore();
}

function drawDoll(state={}){
  const{stuffed=1,eyesOn=true,hairOn=true,hairTies=false,lipstick=false,powder=false}=state;
  const ir=stuffed;
  drawBraids(hairTies);
  drawLegs(ir); drawArms(ir); drawBody(ir); drawHead({eyesOn,hairOn,lipstick,powder,inflateR:ir});
}

function drawDollOutline(dashStyle=true){
  ctx.save();
  // Arms & legs outline (thick purple)
  ctx.strokeStyle='#7B5DE5';ctx.lineWidth=s(22);ctx.lineCap='round';
  if(dashStyle){ctx.setLineDash([s(4),s(3)]);}else{ctx.setLineDash([]);}
  ctx.beginPath();ctx.moveTo(sx(D.lax1),sy(D.lay1));ctx.quadraticCurveTo(sx(D.lacx),sy(D.lacy),sx(D.lax2),sy(D.lay2));ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx(D.rax1),sy(D.ray1));ctx.quadraticCurveTo(sx(D.racx),sy(D.racy),sx(D.rax2),sy(D.ray2));ctx.stroke();
  ctx.lineWidth=s(23);
  ctx.beginPath();ctx.moveTo(sx(D.llx),sy(D.lly1));ctx.lineTo(sx(D.llx),sy(D.lly2));ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx(D.rlx),sy(D.rly1));ctx.lineTo(sx(D.rlx),sy(D.rly2));ctx.stroke();
  // head & body outline (dashed pink)
  ctx.strokeStyle='#FF6B9D';ctx.lineWidth=s(2.5);ctx.setLineDash([s(7),s(5)]);
  ctx.beginPath();ctx.arc(sx(D.hx),sy(D.hy),s(D.hr),0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.roundRect(sx(D.bx),sy(D.by),s(D.bw),s(D.bh),s(10));ctx.stroke();
  ctx.restore();
}

function drawHeart(cx,cy,r,color){
  ctx.save();ctx.fillStyle=color;
  ctx.beginPath();ctx.moveTo(cx,cy+r*.35);
  ctx.bezierCurveTo(cx,cy-r*.4,cx-r*1.4,cy-r*.4,cx-r*1.4,cy+r*.3);
  ctx.bezierCurveTo(cx-r*1.4,cy+r,cx,cy+r*1.65,cx,cy+r*2);
  ctx.bezierCurveTo(cx,cy+r*1.65,cx+r*1.4,cy+r,cx+r*1.4,cy+r*.3);
  ctx.bezierCurveTo(cx+r*1.4,cy-r*.4,cx,cy-r*.4,cx,cy+r*.35);
  ctx.closePath();ctx.fill();ctx.restore();
}

function drawScissors(vx,vy,open=false){
  ctx.save();ctx.translate(sx(vx),sy(vy));
  const a=open?.32:.1;
  ctx.strokeStyle='#888';ctx.lineWidth=s(3);ctx.lineCap='round';
  ctx.save();ctx.rotate(-a);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s(32),s(-4));ctx.stroke();ctx.restore();
  ctx.save();ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s(32),s(4));ctx.stroke();ctx.restore();
  ctx.fillStyle='#555';ctx.beginPath();ctx.arc(0,0,s(4.5),0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#FF6B9D';ctx.lineWidth=s(3.5);
  ctx.beginPath();ctx.arc(-s(9),s(-11),s(9),-.6,Math.PI+.6);ctx.stroke();
  ctx.beginPath();ctx.arc(-s(9),s(11),s(9),Math.PI-.6,.5*Math.PI*2,true);ctx.stroke();
  ctx.restore();
}

function drawCottonBall(vx,vy,r){
  ctx.save();
  [{x:0,y:0,r:1},{x:.5,y:-.4,r:.7},{x:-.5,y:-.4,r:.7},{x:.6,y:.3,r:.65},{x:-.6,y:.3,r:.65}].forEach(o=>{
    ctx.fillStyle='#f0f8ff';ctx.beginPath();ctx.arc(sx(vx)+o.x*s(r),sy(vy)+o.y*s(r),s(r)*o.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ccd';ctx.lineWidth=1;ctx.beginPath();ctx.arc(sx(vx)+o.x*s(r),sy(vy)+o.y*s(r),s(r)*o.r,0,Math.PI*2);ctx.stroke();
  });
  ctx.restore();
}

// ══════════════════════════════════════════════════════════
//  STAGE 0 — CUTTING
// ══════════════════════════════════════════════════════════
const CUT={
  idx:0, scx:CUT_PATH[0].x, scy:CUT_PATH[0].y,
  isDown:false, open:false, openTimer:0,
  init(){
    this.idx=0;this.scx=CUT_PATH[0].x;this.scy=CUT_PATH[0].y;
    this.isDown=false;
    setInst('حرّك إصبعك على الخط لتقص العروسة ✂️');
    showProg(true); setProg(0);
  },
  onDown(v){this.isDown=true;this.update(v);},
  onMove(v){if(this.isDown)this.update(v);},
  onUp(){this.isDown=false;},
  update(v){
    // Find best forward point within reach
    let best=this.idx, bestD=Infinity;
    const ahead=Math.min(this.idx+6, CUT_PATH.length-1);
    for(let i=this.idx;i<=ahead;i++){
      const d=Math.hypot(v.x-CUT_PATH[i].x, v.y-CUT_PATH[i].y);
      if(d<bestD){bestD=d;best=i;}
    }
    if(bestD<45){
      if(best>this.idx){sndClick();vibrate(15);}
      this.idx=Math.max(this.idx,best);
      this.scx=CUT_PATH[this.idx].x;this.scy=CUT_PATH[this.idx].y;
      const prog=this.idx/(CUT_PATH.length-2);
      setProg(Math.round(prog*100));
      if(prog>=.98) setTimeout(()=>{showProg(false);G.next();sndSuccess();},300);
    }
    this.open=bestD<35;
  },
  render(){
    drawFabric(); drawDollOutline(true);
    // cut line so far
    if(this.idx>0){
      ctx.save();ctx.setLineDash([]);ctx.strokeStyle='#FF6B9D';ctx.lineWidth=s(3);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(sx(CUT_PATH[0].x),sy(CUT_PATH[0].y));
      for(let i=1;i<=this.idx;i++) ctx.lineTo(sx(CUT_PATH[i].x),sy(CUT_PATH[i].y));
      ctx.stroke();ctx.restore();
    }
    drawScissors(this.scx,this.scy,this.open);
  }
};

        ctx.fillStyle='#222';ctx.beginPath();ctx.arc(sx(ex),sy(ey),s(7),0,Math.PI*2);ctx.fill();
        ctx.fillStyle='white';ctx.beginPath();ctx.arc(sx(ex+3),sy(ey-4),s(2.5),0,Math.PI*2);ctx.fill();

//  STAGE 2 — SEWING

const SEW={
  sections:null, secIdx:0, dotIdx:0, thread:[],
  pulse:0,
  init(){
    this.sections=buildSewSections();
    this.secIdx=0;this.dotIdx=0;this.thread=[];this.pulse=0;
    this.updateInst();showProg(true);setProg(0);
  },
  updateInst(){
    const sec=this.sections[this.secIdx];
    const total=this.sections.reduce((a,s)=>a+s.pts.length,0);
    const done=this.sections.slice(0,this.secIdx).reduce((a,s)=>a+s.pts.length,0)+this.dotIdx;
    setProg(Math.round(done/total*100));
    setInst(`اضغط على النقطة اللامعة — ${sec.name} (${this.dotIdx+1}/${sec.pts.length})`);
  },
  onDown(v){
    const sec=this.sections[this.secIdx];
    const target=sec.pts[this.dotIdx];
    const d=Math.hypot(v.x-target.x,v.y-target.y);
    if(d<28){
      // Stitch!
      this.thread.push({...target});
      sndStitch();vibrate(20);
      this.dotIdx++;
      if(this.dotIdx>=sec.pts.length){
        this.dotIdx=0;this.secIdx++;
        this.thread=[];
        if(this.secIdx>=this.sections.length){
          showProg(false);setTimeout(()=>{G.next();sndSuccess();},400);return;
        }
      }
      this.updateInst();
    }
  },
  onMove(){},onUp(){},
  render(now){
    this.pulse=(Math.sin(now/250)+1)/2;
    drawFabric();drawDoll({stuffed:0,eyesOn:true});
    const sec=this.sections[this.secIdx];
    // Draw all stitched dots + thread for current section
    if(this.thread.length>1){
      ctx.save();ctx.strokeStyle='#00CC66';ctx.lineWidth=s(2);ctx.lineCap='round';
      ctx.setLineDash([s(5),s(4)]);
      ctx.beginPath();ctx.moveTo(sx(this.thread[0].x),sy(this.thread[0].y));
      for(let i=1;i<this.thread.length;i++) ctx.lineTo(sx(this.thread[i].x),sy(this.thread[i].y));
      ctx.stroke();ctx.restore();
    }
    // Draw all section dots
    sec.pts.forEach((p,i)=>{
      const done=i<this.dotIdx;
      const active=i===this.dotIdx;
      ctx.save();
      if(active){ctx.shadowColor='#FFD93D';ctx.shadowBlur=s(10+this.pulse*12);}
      ctx.fillStyle=done?'#00CC66':active?`rgba(255,217,61,${.7+this.pulse*.3})`:'rgba(255,255,255,.5)';
      ctx.strokeStyle=done?'#009944':active?'#FFD93D':'rgba(255,255,255,.6)';
      ctx.lineWidth=s(2);
      ctx.beginPath();ctx.arc(sx(p.x),sy(p.y),s(active?8:5),0,Math.PI*2);
      ctx.fill();ctx.stroke();ctx.restore();
    });
    // Section label
    ctx.save();ctx.fillStyle='rgba(255,255,255,.8)';ctx.font=`bold ${s(13)}px Tajawal`;
    ctx.textAlign='center';ctx.fillText(`🧵 ${sec.name}`,sx(200),sy(640));ctx.restore();
  }
};

const MAKEUP={
  tool:null, // 'lip' | 'pow'
  lipDone:false, powDone:false,
  lipProg:0, powProg:0,
  isDrawing:false,
  LIP_ZONE:{x:200,y:138,r:36},
  POW_L:{x:D.hx-30,y:D.hy+10,r:28},
  POW_R:{x:D.hx+30,y:D.hy+10,r:28},
  TOOLS:{
    lip:{vx:80,vy:570,w:50,h:70,label:'روج'},
    pow:{vx:320,vy:565,w:50,h:65,label:'بودرة'},
  },
  init(){
    this.tool=null;this.lipDone=false;this.powDone=false;
    this.lipProg=0;this.powProg=0;this.isDrawing=false;
    mctx.clearRect(0,0,makeupCanvas.width,makeupCanvas.height);
    setInst('اختار أداة المكياج واضغط على الوجه 💄');showProg(true);setProg(0);
  },
  onDown(v){
    // Check tool selection
    for(const[k,t] of Object.entries(this.TOOLS)){
      if(Math.abs(v.x-t.vx)<t.w/2+10&&Math.abs(v.y-t.vy)<t.h/2+10){
        this.tool=k;sndClick();
        setInst(k==='lip'?'حرّك الروج على الشفايف 💋':'دوّر السفنجة على الخدود ✨');
        return;
      }
    }
    if(this.tool)this.isDrawing=true;
    this.applyMakeup(v);
  },
  onMove(v){if(this.isDrawing)this.applyMakeup(v);},
  onUp(){this.isDrawing=false;},
  applyMakeup(v){
    if(!this.tool)return;
    if(this.tool==='lip'){
      const d=Math.hypot(v.x-this.LIP_ZONE.x,v.y-this.LIP_ZONE.y);
      if(d<this.LIP_ZONE.r){
        mctx.save();mctx.fillStyle='rgba(180,0,40,.22)';
        mctx.beginPath();mctx.arc(sx(v.x),sy(v.y),s(7),0,Math.PI*2);mctx.fill();mctx.restore();
        this.lipProg=Math.min(1,this.lipProg+.07);
        if(this.lipProg>=1&&!this.lipDone){this.lipDone=true;sndSnap();}
      }
    }else{
      const dL=Math.hypot(v.x-this.POW_L.x,v.y-this.POW_L.y);
      const dR=Math.hypot(v.x-this.POW_R.x,v.y-this.POW_R.y);
      if(dL<this.POW_L.r||dR<this.POW_R.r){
        mctx.save();mctx.shadowColor='rgba(255,100,130,.6)';mctx.shadowBlur=s(20);
        mctx.fillStyle='rgba(255,100,130,.1)';
        mctx.beginPath();mctx.arc(sx(v.x),sy(v.y),s(20),0,Math.PI*2);mctx.fill();mctx.restore();
        this.powProg=Math.min(1,this.powProg+.05);
        if(this.powProg>=1&&!this.powDone){this.powDone=true;sndSnap();}
      }
    }
    const prog=Math.round((this.lipProg+this.powProg)/2*100);
    setProg(prog);
    if(this.lipDone&&this.powDone) setTimeout(()=>{showProg(false);G.next();sndSuccess();},400);
  },
  drawTool(k){
    const t=this.TOOLS[k];
    const active=this.tool===k;
    ctx.save();
    if(active){ctx.shadowColor='#FFD93D';ctx.shadowBlur=s(16);}
    ctx.fillStyle=active?'rgba(255,217,61,.3)':'rgba(255,255,255,.15)';
    ctx.strokeStyle=active?'#FFD93D':'rgba(255,255,255,.4)';ctx.lineWidth=s(2.5);
    ctx.beginPath();ctx.roundRect(sx(t.vx)-s(t.w/2),sy(t.vy)-s(t.h/2),s(t.w),s(t.h),s(12));
    ctx.fill();ctx.stroke();
    ctx.font=`${s(28)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(k==='lip'?'💄':'🧽',sx(t.vx),sy(t.vy-6));
    ctx.fillStyle='#fff';ctx.font=`bold ${s(10)}px Tajawal`;ctx.fillText(t.label,sx(t.vx),sy(t.vy+t.h/2-6));
    ctx.restore();
  },
  render(){
    drawFabric();
    drawDoll({stuffed:1,eyesOn:true,lipstick:this.lipDone,powder:this.powDone});
    // makeup overlay
    ctx.drawImage(makeupCanvas,0,0);
    this.drawTool('lip');this.drawTool('pow');
    // progress labels
    ctx.save();ctx.fillStyle='rgba(255,255,255,.65)';ctx.font=`bold ${s(11)}px Tajawal`;ctx.textAlign='center';
    if(this.lipDone) ctx.fillText('✅ الروج جاهز',sx(80),sy(640));
    if(this.powDone) ctx.fillText('✅ البودرة جاهزة',sx(320),sy(640));
    ctx.restore();
  }
};

const HAIR={
  ties:null, selected:null,

    {x:BRAID_L[BRAID_L.length-1].x, y:BRAID_L[BRAID_L.length-1].y, side:'left',  placed:false},

  SNAP_R:38,
  init(){

  onDown(v){

      ctx.fillText('✿',sx(tip.x),sy(tip.y));ctx.restore();

    this.ties.forEach(t=>{

  },
  buildDots(){
    const c=document.getElementById('dots');c.innerHTML='';
    STAGES_CFG.slice(0,-1).forEach((_,i)=>{
      const d=document.createElement('div');d.className='dot'+(i===0?' active':'');
      d.id='dot'+i;c.appendChild(d);
    });
  },
  updateHUD(){
    STAGES_CFG.slice(0,-1).forEach((_,i)=>{
      const d=document.getElementById('dot'+i);
      if(!d)return;
      d.className='dot'+(i<this.idx?'done':i===this.idx?'active':'');
    });
    const lbl=document.getElementById('stage-lbl');
    if(lbl) lbl.textContent=STAGES_CFG[Math.min(this.idx,STAGES_CFG.length-1)].label;
  },
  startStage(i){
    if(this.raf)cancelAnimationFrame(this.raf);
    this.idx=i;
    this.updateHUD();
    STAGES_CFG[i].h.init();
    this.loop();
  },
  loop(ts=0){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    STAGES_CFG[this.idx].h.render(ts);
    this.raf=requestAnimationFrame(t=>this.loop(t));
  },
  next(){
    if(this.idx+1<STAGES_CFG.length) this.startStage(this.idx+1);
  },
  restart(){
    document.getElementById('done-scr').style.display='none';
    mctx.clearRect(0,0,makeupCanvas.width,makeupCanvas.height);
    this.startStage(0);
  },
  bindInput(){
    const el=canvas;
    const down=e=>{e.preventDefault();const h=STAGES_CFG[this.idx].h;if(h.onDown)h.onDown(toV(e));};
    const move=e=>{e.preventDefault();const h=STAGES_CFG[this.idx].h;if(h.onMove)h.onMove(toV(e));};
    const up=e=>{const h=STAGES_CFG[this.idx].h;if(h.onUp)h.onUp(toV(e));};
    el.addEventListener('pointerdown',down,{passive:false});
    el.addEventListener('pointermove',move,{passive:false});
    el.addEventListener('pointerup',up,{passive:false});
    el.addEventListener('pointercancel',up,{passive:false});
  }
};

// ══════════════════════════════════════════════════════════
//  UI HELPERS
// ══════════════════════════════════════════════════════════
function setInst(t){const e=document.getElementById('inst-txt');if(e)e.textContent=t;}
function showProg(v){const e=document.getElementById('prog-wrap');if(e)e.style.display=v?'block':'none';}
function setProg(p){const e=document.getElementById('prog-fill');if(e)e.style.width=p+'%';}

// ══════════════════════════════════════════════════════════
//  START
// ══════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded',()=>G.init());
</script>
